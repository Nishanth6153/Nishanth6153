name: Update Cyberpunk Profile

on:
  workflow_dispatch:

  schedule:
    - cron: "17 10 * * *"
      timezone: "Asia/Kolkata"

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow requests

      - name: Generate cyberpunk profile card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python generate_profile.py

      - name: Check generated files
        run: |
          echo "Checking generated profile card..."
          ls -lh assets/profile-card.png
          file assets/profile-card.png

      - name: Commit updated profile card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/profile-card.png

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "chore: update cyberpunk profile card"
          git push
