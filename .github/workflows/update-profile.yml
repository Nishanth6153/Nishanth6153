name: Update profile card

on:
  workflow_dispatch:

  schedule:
    - cron: "0 10 * * *"
      timezone: "Asia/Kolkata"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate profile SVGs
        env:
          USERNAME: Nishanth6153
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python update_profile.py

      - name: Commit updated profile card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile.svg profile-light.svg

          git diff --cached --quiet && exit 0

          git commit -m "chore: update profile stats"
          git push
